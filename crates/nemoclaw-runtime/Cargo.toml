[package]
name = "nemoclaw-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# One integration-test binary links the runtime and its dependencies once.
autotests = false

[[test]]
name = "integration"
path = "tests/main.rs"

[[bin]]
name = "nemoclaw-runtime"
path = "src/main.rs"
required-features = ["execution"]

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["signal", "process", "io-util", "fs", "net"] }

serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
jsonschema.workspace = true
thiserror.workspace = true
sha2.workspace = true
sha1.workspace = true
url.workspace = true
regex.workspace = true
async-trait.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
futures-util.workspace = true
tempfile.workspace = true
time.workspace = true
getrandom.workspace = true
process-wrap = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["process"], optional = true }
# The bearer vLLM route filter; reqwest already locks these versions.
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["client", "http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }

[features]
default = ["execution"]
execution = [
    "dep:process-wrap",
    "dep:rustix",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
serde-saphyr.workspace = true
